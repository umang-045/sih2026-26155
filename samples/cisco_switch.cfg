hostname Core-Switch-01

! Weak Vigenère cipher (Type 7) - easily cracked in seconds
service password-encryption
enable password PlainPassword123

username admin password AdminPass123

! Legacy domain and undersized 512-bit RSA key
ip domain-name legacy.local
crypto key generate rsa modulus 512

! Vulnerable legacy SSH protocol
ip ssh version 1

line vty 0 4
 login local
 transport input ssh telnet